# Soda v4 contract for raw.games table
# Data quality checks for raw games data from RAWG API

dataset: gaming_analytics/raw/games

columns:
  - name: id
    checks:
      - missing:
      - duplicate:

  - name: name
    checks:
      - missing:

  - name: released

  - name: updated

  - name: rating
    checks:
      - missing:
          threshold:
            metric: percent
            must_be_less_than: 50

  - name: rating_top
    checks:
      - invalid:
          valid_max: 5

  - name: ratings_count
    checks:
      - invalid:
          valid_min: 0

  - name: reviews_count
    checks:
      - invalid:
          valid_min: 0

  - name: playtime
    checks:
      - invalid:
          valid_min: 0

  - name: added
    checks:
      - invalid:
          valid_min: 0

checks:
  - row_count:
      name: Games table has data
      must_be_greater_than: 0

  - row_count:
      qualifier: volume_check
      name: Reasonable data volume
      must_be_less_than: 1000000
