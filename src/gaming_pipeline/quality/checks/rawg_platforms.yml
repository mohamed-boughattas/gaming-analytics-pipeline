# Soda v4 contract for raw.rawg_platforms table
# Data quality checks for raw platforms data from RAWG API

dataset: gaming_analytics/raw/rawg_platforms
columns:
  # Primary key validation
  - name: id
    checks:
      - name: Platform ID not null
        missing:
          score: 0
      - name: Platform ID unique
        duplicate:
          score: 0

  # Required business fields
  - name: name
    checks:
      - name: Platform name not null
        missing:
          score: 0
      - name: Platform name reasonable length
        length:
          min: 1
          max: 100

  # Slug field (URL-friendly identifier)
  - name: slug
    checks:
      - name: Slug not null
        missing:
          score: 0
      - name: Slug format valid (lowercase, hyphens, parentheses)
        invalid:
          threshold: 0.01
          regex: "^[a-z0-9]+(-[a-z0-9]+)*(\\([0-9]+\\))?$"

# Table-level checks
checks:
  - name: Platforms table has data
    row_count:
      greater_than: 0

  - name: Reasonable platform count
    row_count:
      less_than: 200

  - name: All platforms have names
    missing_percent:
      column: name
      less_than: 0.1

  - name: All platforms have slugs
    missing_percent:
      column: slug
      less_than: 0.1
