[project]
name = "gaming_analytics_pipeline"
version = "0.1.0"
description = "Modern data engineering pipeline for gaming analytics using the RAWG API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlt[duckdb]>=1.0.0",
    "prefect>=3.2.0",
    "sqlmesh>=0.100.0",
    "requests>=2.31.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "duckdb>=1.4.0,<1.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pendulum>=3.0.0",
    "marimo>=0.20.4",
    "plotly>=6.6.0",
    "websockets>=14.2.0",
    "soda-duckdb>=4.1.1",
    "tenacity>=8.0.0",
]

[tool.uv]
resolution = "highest"
override-dependencies = ["urllib3>=2.6.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/gaming_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "responses>=0.25.0",
    "ty>=0.0.20",
    "sqlfluff>=3.0.0",
    "yamllint>=1.35.0",
    "chardet<6.0.0",
]

ty = ["ty>=0.0.20"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "S311",
    "S110",
] # Allow assert, random, and try-except-pass in tests
"src/gaming_pipeline/config/__init__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::Warning",
    "default:.*urllib3.*:DeprecationWarning",
    "default:.*charset_normalizer.*:DeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests (requires Prefect server, run with --integration)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
