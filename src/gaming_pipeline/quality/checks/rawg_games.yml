# Soda v4 contract for raw.rawg_games table
# Comprehensive data quality checks for raw games data from RAWG API

dataset: gaming_analytics/raw/rawg_games
columns:
  # Primary key validation
  - name: id
    checks:
      - name: Game ID not null
        missing:
          score: 0
      - name: Game ID unique
        duplicate:
          score: 0

  # Required business fields
  - name: name
    checks:
      - name: Game name not null
        missing:
          score: 0
      - name: Game name reasonable length
        length:
          min: 1
          max: 500

  # Date fields
  - name: released
    checks:
      - name: Release date not null (warn)
        missing:
          score: 0.5
      - name: Release date in reasonable range
        invalid:
          threshold: 0.1
          regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

  - name: updated
    checks:
      - name: Update date format valid
        invalid:
          threshold: 0.1
          regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"

  # Rating fields (0-5 scale from RAWG API)
  - name: rating
    checks:
      - name: Rating in valid range (0-5)
        invalid:
          threshold: 0.05
          values:
            - 0
            - 0.5
            - 1
            - 1.5
            - 2
            - 2.5
            - 3
            - 3.5
            - 4
            - 4.5
            - 5

  - name: rating_top
    checks:
      - name: Rating top equals 5
        invalid:
          threshold: 0.01
          values:
            - 5

  - name: ratings_count
    checks:
      - name: Ratings count non-negative
        invalid:
          threshold: 0.01
          regex: "^[0-9]+$"

  - name: reviews_count
    checks:
      - name: Reviews count non-negative
        invalid:
          threshold: 0.01
          regex: "^[0-9]+$"

  # Metacritic score (0-100 scale)
  - name: metacritic
    checks:
      - name: Metacritic in valid range (0-100)
        invalid:
          threshold: 0.1
          regex: "^([0-9]|[1-9][0-9]|100)$"

  # Playtime in hours
  - name: playtime
    checks:
      - name: Playtime non-negative
        invalid:
          threshold: 0.01
          regex: "^[0-9]+$"

  # Engagement metrics
  - name: added
    checks:
      - name: Added count non-negative
        invalid:
          threshold: 0.01
          regex: "^[0-9]+$"

  - name: suggestions_count
    checks:
      - name: Suggestions count non-negative
        invalid:
          threshold: 0.01
          regex: "^[0-9]+$"

# Table-level checks
checks:
  - name: Games table has data
    row_count:
      greater_than: 0

  - name: Reasonable data volume
    row_count:
      less_than: 1000000

  - name: Most games have names
    missing_percent:
      column: name
      less_than: 1

  - name: Most games have release dates
    missing_percent:
      column: released
      less_than: 10
