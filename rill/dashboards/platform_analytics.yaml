# Platform Analytics Dashboard
# Performance analytics across gaming platforms

title: Platform Analytics
model: platforms_source
display_name: Platform Analytics

dimensions:
  - name: name
    display_name: Platform Name
    description: Name of the gaming platform
    column: name
    type: categorical

  - name: slug
    display_name: Platform Slug
    description: URL-friendly platform identifier
    column: slug
    type: categorical

  - name: year_start
    display_name: Start Year
    description: Year the platform was launched
    column: year_start
    type: time

  - name: year_end
    display_name: End Year
    description: Year the platform was discontinued
    column: year_end
    type: time

measures:
  - name: total_platforms
    display_name: Total Platforms
    description: Number of unique platforms
    expression: count(*)
    format_preset: "#,##0"

  - name: total_games_all
    display_name: Total Games
    description: Total number of games across all platforms
    expression: sum(total_games)
    format_preset: "#,##0"

  - name: avg_games_per_platform
    display_name: Avg Games/Platform
    description: Average number of games per platform
    expression: avg(total_games)
    format_preset: "#,##0.0"

  - name: overall_avg_rating
    display_name: Overall Avg Rating
    description: Average rating across all platforms
    expression: avg(avg_rating)
    format_preset: "#,##0.00"

  - name: overall_avg_metacritic
    display_name: Overall Avg Metacritic
    description: Average Metacritic across all platforms
    expression: avg(avg_metacritic)
    format_preset: "#,##0.0"

  - name: total_ratings
    display_name: Total Ratings
    description: Total user ratings across all platforms
    expression: sum(total_ratings)
    format_preset: "#,##0"

  - name: total_excellent_games
    display_name: Total Excellent Games
    description: Total excellent games across all platforms
    expression: sum(excellent_games)
    format_preset: "#,##0"

  - name: total_good_games
    display_name: Total Good Games
    description: Total good games across all platforms
    expression: sum(good_games)
    format_preset: "#,##0"

  - name: overall_excellent_pct
    display_name: Overall Excellent %
    description: Percentage of excellent games across all platforms
    expression: avg(excellent_pct)
    format_preset: "#,##0.0%"

  - name: overall_good_pct
    display_name: Overall Good %
    description: Percentage of good games across all platforms
    expression: avg(good_pct)
    format_preset: "#,##0.0%"

  - name: avg_playtime_all
    display_name: Overall Avg Playtime (hrs)
    description: Average playtime across all platforms
    expression: avg(avg_playtime)
    format_preset: "#,##0.0"

  - name: max_avg_rating
    display_name: Best Platform Rating
    description: Highest average rating among platforms
    expression: max(avg_rating)
    format_preset: "#,##0.00"

  - name: min_avg_rating
    display_name: Lowest Platform Rating
    description: Lowest average rating among platforms
    expression: min(avg_rating)
    format_preset: "#,##0.00"

  - name: active_platforms
    display_name: Active Platforms
    description: Number of platforms still active (year_end is null)
    expression: countIf(year_end IS NULL)
    format_preset: "#,##0"

  - name: top_platforms_count
    display_name: Top-Rated Platforms
    description: Number of platforms with avg rating >= 4.0
    expression: countIf(avg_rating >= 4.0)
    format_preset: "#,##0"
smallest_time_grain: day
