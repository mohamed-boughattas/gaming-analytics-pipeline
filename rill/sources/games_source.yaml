# Games Source - Enriched game data from SQLMesh marts layer
# https://docs.rill.dev/reference/project-files/sources

type: source
connector: duckdb
sql: |
  SELECT
    id,
    name,
    released,
    updated,
    rating,
    rating_top,
    ratings_count,
    metacritic,
    playtime,
    suggestions_count,
    reviews_count,
    rating_category,
    release_year,
    release_month,
    engagement_score
  FROM gaming_analytics.marts.games
  WHERE id IS NOT NULL