# Genre Performance Dashboard
# Analytics focused on game genres and their performance metrics

title: Genre Performance
model: genres_source
display_name: Genre Performance

dimensions:
  - name: name
    display_name: Genre Name
    description: Name of the game genre
    column: name
    type: categorical

  - name: slug
    display_name: Genre Slug
    description: URL-friendly genre identifier
    column: slug
    type: categorical

measures:
  - name: total_genres
    display_name: Total Genres
    description: Number of unique genres
    expression: count(*)
    format_preset: "#,##0"

  - name: total_games_all
    display_name: Total Games
    description: Total number of games across all genres
    expression: sum(total_games)
    format_preset: "#,##0"

  - name: avg_games_per_genre
    display_name: Avg Games/Genre
    description: Average number of games per genre
    expression: avg(total_games)
    format_preset: "#,##0.0"

  - name: overall_avg_rating
    display_name: Overall Avg Rating
    description: Average rating across all genres
    expression: avg(avg_rating)
    format_preset: "#,##0.00"

  - name: overall_avg_metacritic
    display_name: Overall Avg Metacritic
    description: Average Metacritic across all genres
    expression: avg(avg_metacritic)
    format_preset: "#,##0.0"

  - name: total_ratings
    display_name: Total Ratings
    description: Total user ratings across all genres
    expression: sum(total_ratings)
    format_preset: "#,##0"

  - name: total_excellent_games
    display_name: Total Excellent Games
    description: Total excellent games across all genres
    expression: sum(excellent_games)
    format_preset: "#,##0"

  - name: total_good_games
    display_name: Total Good Games
    description: Total good games across all genres
    expression: sum(good_games)
    format_preset: "#,##0"

  - name: overall_excellent_pct
    display_name: Overall Excellent %
    description: Percentage of excellent games across all genres
    expression: avg(excellent_pct)
    format_preset: "#,##0.0%"

  - name: overall_good_pct
    display_name: Overall Good %
    description: Percentage of good games across all genres
    expression: avg(good_pct)
    format_preset: "#,##0.0%"

  - name: avg_playtime_all
    display_name: Overall Avg Playtime (hrs)
    description: Average playtime across all genres
    expression: avg(avg_playtime)
    format_preset: "#,##0.0"

  - name: max_avg_rating
    display_name: Best Genre Rating
    description: Highest average rating among genres
    expression: max(avg_rating)
    format_preset: "#,##0.00"

  - name: min_avg_rating
    display_name: Lowest Genre Rating
    description: Lowest average rating among genres
    expression: min(avg_rating)
    format_preset: "#,##0.00"

  - name: top_genres_count
    display_name: Top-Rated Genres
    description: Number of genres with avg rating >= 4.0
    expression: countIf(avg_rating >= 4.0)
    format_preset: "#,##0"
