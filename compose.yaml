services:
  gaming-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming_analytics_pipeline
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/gaming_analytics.duckdb
      - PREFECT_API_URL=${PREFECT_API_URL:-http://localhost:4200/api}
      - RAWG_API_KEY=${RAWG_API_KEY:-}
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["uv", "run", "prefect", "server", "start", "--host", "0.0.0.0"]

  marimo-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.marimo
    container_name: gaming_analytics_marimo
    volumes:
      - ./data:/app/data
      - ./marimo:/app/marimo
      - ./src:/app/src
    ports:
      - "2718:2718"
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app:/app/src
      - DATABASE_PATH=/app/data/gaming_analytics.duckdb
    depends_on:
      gaming-pipeline:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2718/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  default:
    name: gaming-analytics-network
