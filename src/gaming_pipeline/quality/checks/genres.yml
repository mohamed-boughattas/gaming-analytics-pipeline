# Soda v4 contract for marts.genres table
# Data quality checks for genres mart dimension table

dataset: gaming_analytics/marts/genres
columns:
  # Primary key validation
  - name: id
    checks:
      - name: Genre ID not null
        missing:
          score: 0
      - name: Genre ID unique
        duplicate:
          score: 0

  # Required business fields
  - name: name
    checks:
      - name: Genre name not null
        missing:
          score: 0
      - name: Genre name reasonable length
        length:
          min: 1
          max: 100

  # Slug field (URL-friendly identifier)
  - name: slug
    checks:
      - name: Slug not null
        missing:
          score: 0
      - name: Slug format valid (lowercase, hyphens)
        invalid:
          threshold: 0.01
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"

  # Games count (aggregated metric)
  - name: games_count
    checks:
      - name: Games count non-negative
        invalid:
          threshold: 0.01
          regex: "^[0-9]+$"

# Table-level checks
checks:
  - name: Genres mart has data
    row_count:
      greater_than: 0

  - name: Reasonable genre count
    row_count:
      less_than: 100

  - name: All genres have names
    missing_percent:
      column: name
      less_than: 0.1

  - name: All genres have slugs
    missing_percent:
      column: slug
      less_than: 0.1
