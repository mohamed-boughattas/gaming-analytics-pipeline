services:
  gaming-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming_analytics_pipeline
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/gaming_analytics.duckdb
      - PREFECT_API_URL=${PREFECT_API_URL:-http://0.0.0.0:4200/api}
    ports:
      - "4200:4200"
    restart: unless-stopped
    command: ["uv", "run", "prefect", "server", "start", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  marimo-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.marimo
    container_name: gaming_analytics_marimo
    volumes:
      - ./data:/app/data
      - ./marimo:/app/marimo
      - ./src:/app/src
    ports:
      - "2718:2718"
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app:/app/src
      - DATABASE_PATH=/app/data/gaming_analytics.duckdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2718/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  evidence-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.evidence
    container_name: gaming_analytics_evidence
    volumes:
      - ./evidence/pages:/app/pages
      - ./evidence/sources:/app/sources
      - ./evidence/.evidence:/app/.evidence
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rill-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.rill
    container_name: gaming_analytics_rill
    volumes:
      - ./data:/app/data
      - ./rill:/app/rill
    ports:
      - "9009:9009"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9009/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  evidence_node_modules:
